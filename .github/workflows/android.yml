name: Android APK

on:
  push:
    branches: [android-port]
    paths:
      - '.github/workflows/android.yml'
      - 'smstrikers-port/**'
  pull_request:
    branches: [main, android-port]
    paths:
      - '.github/workflows/android.yml'
      - 'smstrikers-port/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: smstrikers-port
        shell: bash
    env:
      ANDROID_NDK_VERSION: '29.0.14206865'
      ANDROID_BUILD_TOOLS_VERSION: '35.0.1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "ndk;$ANDROID_NDK_VERSION" \
            "platforms;android-35" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION"

      - name: Build native libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          ./tools/build-android.sh

      - name: Assemble APK
        run: ./android/gradlew -p android --no-daemon assembleRelease

      - name: Stage and verify strikers.apk
        run: |
          apk="$RUNNER_TEMP/strikers-android/strikers.apk"
          sdk_tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          install -D -m 0644 android/app/build/outputs/apk/release/app-release.apk "$apk"
          "$sdk_tools/apksigner" verify --verbose "$apk"
          "$sdk_tools/zipalign" -c -P 16 4 "$apk"
          "$sdk_tools/aapt2" dump badging "$apk" | grep -Fx "native-code: 'arm64-v8a'"
          entries=$(unzip -Z1 "$apk")
          for lib in libmain.so libc++_shared.so libvulkan.so libmain_hook.so \
                     libfile_redirect_hook.so libgsl_alloc_hook.so libhook_impl.so; do
            grep -Fx "lib/arm64-v8a/$lib" <<< "$entries"
          done

      - name: Upload strikers.apk
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/strikers-android/strikers.apk
          archive: false
          if-no-files-found: error
