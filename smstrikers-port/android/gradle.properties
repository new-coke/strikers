org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Where the native build left its shared objects, and where the Java that goes with them lives.
# All three are relative to android/app/ and all three are outputs of tools/build-android.sh:
# SDL's Java has to be the Java of the SDL the game was linked against, so it is taken from the
# build directory rather than vendored.
strikers.nativeBuildDir=../../build-android
strikers.sdlJavaDir=../../build-android/_deps/sdl-src/android-project/app/src/main/java
strikers.auroraJavaDir=../../extern/aurora/platforms/android/java
